name: Build & Release (+deb)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  get_version:
    name: Get version from Cargo.toml
    runs-on: ubuntu-22.04

    outputs:
      release_version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Getting version
        id: get-version
        run: |
          VERSION=$(sed -nE 's/^version\s*=\s*(\S*)$/\1/p' Cargo.toml | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


  create_release_draft:
    name: Create the release draft
    runs-on: ubuntu-latest

    needs:
      - get_version

    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Extract release notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v1

      - name: Create release draft
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get_version.outputs.release_version }}
          RELEASE_NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
        run: |
          RELEASE=$(gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/releases" \
            --field "tag_name=${VERSION}" \
            --field "name=Peers updater v. ${VERSION}" \
            --field "body=${RELEASE_NOTES}" \
            --field "draft=true" \
            --field "prerelease=false")

          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')

          UPLOAD_URL=$(echo "$RELEASE" | jq -r '.upload_url' | sed 's/{?name,label}//')

          echo "Created release:"
          echo "  ID: ${RELEASE_ID}"
          echo "  Upload URL: ${UPLOAD_URL}"

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "upload_url=${UPLOAD_URL}" >> "$GITHUB_OUTPUT"


  build:
    name: Build ${{ matrix.target }}

    needs:
      - get_version
      - create_release_draft

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # -----------------------------------------------------------------
          # macOS
          # -----------------------------------------------------------------

          - target: x86_64-apple-darwin
            os: macos-15
            deb_arch: ''
            use_cross: false

          # -----------------------------------------------------------------
          # Linux
          # -----------------------------------------------------------------

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            deb_arch: amd64
            use_cross: false

          - target: i686-unknown-linux-gnu
            os: ubuntu-22.04
            deb_arch: i386
            use_cross: true

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            deb_arch: arm64
            use_cross: true

          - target: arm-unknown-linux-gnueabi
            os: ubuntu-22.04
            deb_arch: armel
            use_cross: true

          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-22.04
            deb_arch: armhf
            use_cross: true

          # -----------------------------------------------------------------
          # Windows
          # -----------------------------------------------------------------

          - target: i686-pc-windows-gnu
            os: ubuntu-22.04
            deb_arch: ''
            use_cross: true

          - target: x86_64-pc-windows-gnu
            os: ubuntu-22.04
            deb_arch: ''
            use_cross: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'

      # ---------------------------------------------------------------------
      # macOS
      # ---------------------------------------------------------------------

      - name: Add Rust target
        if: ${{ !matrix.use_cross }}
        run: |
          rustup target add "${{ matrix.target }}"

      # ---------------------------------------------------------------------
      # Linux / Windows cross-compilation
      # ---------------------------------------------------------------------

      - name: Install cross
        if: ${{ matrix.use_cross }}
        run: |
          cargo install --force --locked cross

      # ---------------------------------------------------------------------
      # Debian package tools
      # ---------------------------------------------------------------------

      - name: Install Debian package tools
        if: ${{ matrix.deb_arch != '' }}
        run: |
          sudo apt update
          sudo apt-get install -y dpkg-dev

      # ---------------------------------------------------------------------
      # Show versions / manifest
      # ---------------------------------------------------------------------
      - name: Show tool versions
        if: ${{ matrix.use_cross }}
        run: |
          cross --version
          cargo --version
          rustc --version

      - name: Validate Cargo manifest
        if: ${{ matrix.use_cross }}
        run: |
          cargo metadata --locked --no-deps
          
      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------

      - name: Build binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build \
              --locked \
              --release \
              --target "$TARGET"
          else
            cargo build \
              --locked \
              --release \
              --target "$TARGET"
          fi

      # ---------------------------------------------------------------------
      # Determine binary name
      # ---------------------------------------------------------------------

      - name: Set binary path
        id: binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == *"windows"* ]]; then
            echo "path=target/$TARGET/release/peers_updater.exe" >> "$GITHUB_OUTPUT"
          else
            echo "path=target/$TARGET/release/peers_updater" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # Prepare executable
      # ---------------------------------------------------------------------

      - name: Set executable permission
        if: ${{ !contains(matrix.target, 'windows') }}
        env:
          BINARY: ${{ steps.binary.outputs.path }}
        run: |
          chmod og+x "$BINARY"

      # ---------------------------------------------------------------------
      # Create ZIP
      # ---------------------------------------------------------------------

      - name: Install zip
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt update
          sudo apt-get install -y zip

      - name: Create ZIP archive
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ steps.binary.outputs.path }}
        run: |
          zip -9 -j \
            "target/$TARGET/release/$TARGET.zip" \
            "$BINARY"

      # ---------------------------------------------------------------------
      # Create Debian package
      # ---------------------------------------------------------------------

      - name: Prepare Debian package
        if: ${{ matrix.deb_arch != '' }}
        env:
          VERSION: ${{ needs.get_version.outputs.release_version }}
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          BINARY: ${{ steps.binary.outputs.path }}
        run: |
          PACKAGE_DIR="peers_updater_${VERSION}_${DEB_ARCH}"

          mkdir -p "$PACKAGE_DIR/DEBIAN"
          mkdir -p "$PACKAGE_DIR/opt/peers_updater"

          cp \
            "$BINARY" \
            "$PACKAGE_DIR/opt/peers_updater/peers_updater"

          chmod 755 \
            "$PACKAGE_DIR/opt/peers_updater/peers_updater"

          cp \
            .github/workflows/packaging/postinst \
            "$PACKAGE_DIR/DEBIAN/postinst"

          cp \
            .github/workflows/packaging/prerm \
            "$PACKAGE_DIR/DEBIAN/prerm"

          chmod 755 "$PACKAGE_DIR/DEBIAN/postinst"
          chmod 755 "$PACKAGE_DIR/DEBIAN/prerm"

          cat > "$PACKAGE_DIR/DEBIAN/control" <<EOF
          Package: peers-updater
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: YggUser
          Description: Yggdrasil peer updater
           Automatically updates Yggdrasil peer configuration.
          EOF

          dpkg-deb --build "$PACKAGE_DIR"

      # ---------------------------------------------------------------------
      # Upload ZIP
      # ---------------------------------------------------------------------

      - name: Upload ZIP to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ needs.create_release_draft.outputs.upload_url }}
          FILE: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ matrix.target }}.zip
        run: |
          gh api \
            --method POST \
            "${UPLOAD_URL}?name=$(basename "$FILE")" \
            --header "Content-Type: application/zip" \
            --input "$FILE"

      # ---------------------------------------------------------------------
      # Upload Debian package
      # ---------------------------------------------------------------------

      - name: Upload Debian package to GitHub release
        if: ${{ matrix.deb_arch != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ needs.create_release_draft.outputs.upload_url }}
          FILE: ${{ github.workspace }}/peers_updater_${{ needs.get_version.outputs.release_version }}_${{ matrix.deb_arch }}.deb
        run: |
          gh api \
            --method POST \
            "${UPLOAD_URL}?name=$(basename "$FILE")" \
            --header "Content-Type: application/vnd.debian.binary-package" \
            --input "$FILE"
