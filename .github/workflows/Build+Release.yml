name: Build & Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  get_version:
    name: Get version from Cargo.toml
    runs-on: ubuntu-22.04
    outputs:
      release_version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Getting version
        id: get-version
        run: |
          VERSION=$(sed -nE 's/^version\s*=\s*(\S*)$/\1/p' Cargo.toml | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  create_release_draft:
    name: Create the release draft
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release-draft.outputs.id }}

    needs: get_version

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Extract release notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v1

      - name: Create release draft
        id: create-release-draft
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.get_version.outputs.release_version }}
          release_name: Peers updater v. ${{ needs.get_version.outputs.release_version }}
          draft: true
          prerelease: false
          body: ${{ steps.extract-release-notes.outputs.release_notes }}

  build_and_upload_drwn:
    name: Create and upload binaries (x86_64-apple-darwin)
    needs: [ create_release_draft ]
    runs-on: macos-15

    strategy:
      matrix:
        target: [ x86_64-apple-darwin ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'

      - name: Preparing for cross-compilation (x86_64-apple-darwin)
        run: |
          rustup target add x86_64-apple-darwin

      - name: Build and compress binaries (x86_64-apple-darwin)
        run: |
          cargo build --release --target x86_64-apple-darwin
          chmod og+x "target/x86_64-apple-darwin/release/peers_updater"
          zip -9 -j "target/x86_64-apple-darwin/release/x86_64-apple-darwin.zip" "target/x86_64-apple-darwin/release/peers_updater"

      - name: Add archives to the release draft
        uses: xresloader/upload-to-github-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create_release_draft.outputs.release_id }}
        with:
          release_id: ${{ env.RELEASE_ID }}
          file: "${{ github.workspace }}/target/*/release/*.zip"
          draft: true

  build_and_upload_linux_unknown:
    name: Create and upload binaries (x86_64-unknown-linux-gnu)
    needs: [ create_release_draft ]
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'

      - name: Preparing for cross-compilation (x86_64-unknown-linux-gnu)
        run: |
          rustup target add x86_64-unknown-linux-gnu

      - name: Build and compress binaries (x86_64-unknown-linux-gnu)
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          chmod og+x "target/x86_64-unknown-linux-gnu/release/peers_updater"
          zip -9 -j "target/x86_64-unknown-linux-gnu/release/x86_64-unknown-linux-gnu.zip" "target/x86_64-unknown-linux-gnu/release/peers_updater"

      - name: Add archives to the release draft
        uses: xresloader/upload-to-github-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create_release_draft.outputs.release_id }}
        with:
          release_id: ${{ env.RELEASE_ID }}
          file: "${{ github.workspace }}/target/*/release/*.zip"
          draft: true

  build_and_upload_others:
    name: Create and upload binaries
    needs: [ create_release_draft ]
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        target:
          - i686-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - arm-unknown-linux-gnueabi
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - armv7-unknown-linux-gnueabihf

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'

      - name: Preparing for cross-compilation (arm)
        if: ${{ contains(matrix.target, 'armv7-unknown-linux-gnueabihf') || contains(matrix.target, 'arm-unknown-linux-gnueabi') }}
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND='noninteractive' apt-get -y -o Dpkg::Options::='--force-confdef' -o Dpkg::Options::='--force-confold' upgrade
          sudo apt-get -y install zip gcc-arm-linux-gnueabihf
          cargo install --force --locked cross

      - name: Preparing for cross-compilation (other)
        if: ${{ !contains(matrix.target, 'arm') && !contains(matrix.target, 'darwin') }}
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND='noninteractive' apt-get -y -o Dpkg::Options::='--force-confdef' -o Dpkg::Options::='--force-confold' upgrade
          sudo apt-get -y install zip gcc-aarch64-linux-gnu
          cargo install --force --locked cross

      - name: Build and compress binaries (other)
        if: ${{ !contains(matrix.target, 'darwin') }}
        run: .github/workflows/build+zip.sh ${{ matrix.target }}

      - name: Add archives to the release draft
        uses: xresloader/upload-to-github-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create_release_draft.outputs.release_id }}
        with:
          release_id: ${{ env.RELEASE_ID }}
          file: "${{ github.workspace }}/target/*/release/*.zip"
          draft: true

  build_deb:
    name: Build Debian package (${{ matrix.deb_arch }})
    needs: [ get_version, create_release_draft ]
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            deb_arch: amd64

          - target: i686-unknown-linux-gnu
            deb_arch: i386

          - target: aarch64-unknown-linux-gnu
            deb_arch: arm64

          - target: arm-unknown-linux-gnueabi
            deb_arch: armel

          - target: armv7-unknown-linux-gnueabihf
            deb_arch: armhf

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt-get install -y dpkg-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf

      - name: Install cross
        run: |
          cargo install --force --locked cross

      - name: Build binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cross build --release --target "$TARGET"

      - name: Prepare Debian package
        env:
          VERSION: ${{ needs.get_version.outputs.release_version }}
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          PACKAGE_DIR="peers_updater_${VERSION}_${DEB_ARCH}"

          mkdir -p "$PACKAGE_DIR/DEBIAN"
          mkdir -p "$PACKAGE_DIR/opt/peers_updater"

          cp "target/${TARGET}/release/peers_updater" "$PACKAGE_DIR/opt/peers_updater/peers_updater"

          chmod 755 "$PACKAGE_DIR/opt/peers_updater/peers_updater"

          cp .github/workflows/packaging/postinst "$PACKAGE_DIR/DEBIAN/postinst"
          cp .github/workflows/packaging/prerm "$PACKAGE_DIR/DEBIAN/prerm"

          chmod 755 "$PACKAGE_DIR/DEBIAN/postinst"
          chmod 755 "$PACKAGE_DIR/DEBIAN/prerm"

          cat > "$PACKAGE_DIR/DEBIAN/control" <<EOF
          Package: peers-updater
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: YggUser
          Description: Yggdrasil peer updater
           Automatically updates Yggdrasil peer configuration.
          EOF

          dpkg-deb --build "$PACKAGE_DIR"

      - name: Add Debian package to the release draft
        uses: xresloader/upload-to-github-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create_release_draft.outputs.release_id }}
        with:
          release_id: ${{ env.RELEASE_ID }}
          file: "${{ github.workspace }}/peers_updater_*.deb"
          draft: true
