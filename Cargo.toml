[package]
name = "peers_updater"
version = "0.3.7"
edition = "2021"
authors = ["YggUser (https://matrix.to/#/@ygguser:matrix.org)"]
readme = "README.md"
repository = "https://github.com/ygguser/peers_updater"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.1.6", default-features = false, features = [
    "help",
    "std",
] }
nu-json = { version = "0.84.0", default-features = false, optional = true }

regex-lite = "0.1.9"

zip = { version = "0.6.4", default-features = false, features = ["deflate"] }

tiny_http_client = { git = "https://github.com/ygguser/tiny_http_client", features = ["own-cert-list"] }
#tiny_http_client = { path = "../tiny_http_client", features = ["own-cert-list"] }

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[features]
default = ["updating_cfg", "using_api", "self_updating"]
updating_cfg = []
using_api = ["dep:nu-json"]
self_updating = ["dep:nu-json"]
